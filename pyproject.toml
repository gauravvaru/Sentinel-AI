[project]
name = "sentinelai"
version = "0.1.0"
description = "SentinelAI - Phase 1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.28.0",
    "psycopg2-binary>=2.9.9",
    "python-dateutil>=2.8.2",
    "pytz",
    "greenlet",
    "telethon>=1.33.1",
    "google-api-python-client>=2.115.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.14.0",
    "evaluate>=0.4.0",
    "sentence-transformers>=2.2.2",
    "bertopic>=0.16.0",
    "hdbscan>=0.8.33",
    "pgvector>=0.2.4",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]
