[project]
name = "sentinelai"
version = "0.1.0"
description = "SentinelAI - Phase 1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.28.0",
    "psycopg2-binary>=2.9.9",
    "python-dateutil>=2.8.2",
    "pytz",
    "greenlet"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]
